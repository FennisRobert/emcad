[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "emcad"
version = "0.2.0"
description = "A 2D polygon/CAD geometry kernel (Rust core) and a from-scratch ODB++ PCB format parser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Robert Fennis" },
]
keywords = ["odb++", "pcb", "eda", "geometry", "polygon", "cad", "boolean", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "loguru>=0.7.0",
    "matplotlib>=3.8.0",
    "msgpack>=1.0.0",
    "numpy>=2.2, <2.5",
]

[project.urls]
Repository = "https://github.com/FennisRobert/emcad"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.maturin]
# Pure-Python package from src/, plus the Rust kernel (rust/) compiled
# in as the `emcad._rs` extension module.
python-source = "src"
module-name = "emcad._rs"
manifest-path = "rust/Cargo.toml"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
# rebuild the Rust extension on `uv sync`/`uv run` whenever its sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "rust/Cargo.toml" }, { file = "rust/src/**/*.rs" }]
