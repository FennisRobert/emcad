[package]
name = "emcad_rs"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
rayon = "1.12"

[features]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
